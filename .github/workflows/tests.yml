name: Tests

on:
  push:
    branches: [main]
  pull_request:

# Droits minimaux : ce workflow ne fait que lire le code
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm test
